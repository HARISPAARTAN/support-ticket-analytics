<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Support Ticket Analytics architecture</title>
  <desc id="desc">The seeded generator writes the quarterly ticket and event files. Branch a: Power Query in the PBIP combines the folders and computes business minutes with fnBusinessMinutes, feeding the TMDL model and the PBIR report. Branch b: the pandas reference computes the same durations with tools/bizhours.py and feeds the measure test, the reconciliation table and the replica data builder, which writes replica.json and the expected states for the HTML replica. The branches meet in the reconciliation table.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93A1B0"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E6EDF3; font-size: 14px; }
      .title { font-size: 18px; font-weight: 600; }
      .head { font-size: 15px; font-weight: 600; fill: #F2A93B; }
      .muted { fill: #93A1B0; font-size: 13px; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; }
      .box { fill: #121820; stroke: #1F2A36; stroke-width: 1.5; }
      .meet { fill: #182130; stroke: #F2A93B; stroke-width: 1.5; }
      .flow { fill: none; stroke: #93A1B0; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="12" fill="#0B0F14"/>
  <text class="title" x="24" y="40">Two branches from the same files</text>

  <rect class="box" x="24" y="72" width="240" height="132" rx="8"/>
  <text class="head" x="40" y="100">Generator</text>
  <text class="mono" x="40" y="126">tools/make_data.py</text>
  <text class="muted" x="40" y="150">seed 20240101, --check</text>
  <text class="mono" x="40" y="176">data/tickets/*.csv</text>
  <text class="mono" x="40" y="194">data/ticket_events/*.csv</text>

  <text class="muted" x="312" y="92">a  Power BI</text>
  <rect class="box" x="312" y="104" width="196" height="100" rx="8"/>
  <text class="head" x="328" y="132">Power Query</text>
  <text class="muted" x="328" y="156">folders, en-US types,</text>
  <text class="muted" x="328" y="176">fnBusinessMinutes</text>

  <rect class="box" x="532" y="104" width="196" height="100" rx="8"/>
  <text class="head" x="548" y="132">TMDL model</text>
  <text class="muted" x="548" y="156">star schema, 49 measures,</text>
  <text class="muted" x="548" y="176">calc group, RLS</text>

  <rect class="box" x="752" y="104" width="184" height="100" rx="8"/>
  <text class="head" x="768" y="132">PBIR report</text>
  <text class="muted" x="768" y="156">eight pages,</text>
  <text class="muted" x="768" y="176">theme Quillstack Dark</text>

  <text class="muted" x="312" y="292">b  Python</text>
  <rect class="box" x="312" y="304" width="196" height="100" rx="8"/>
  <text class="head" x="328" y="332">Reference</text>
  <text class="mono" x="328" y="356">tools/reference.py</text>
  <text class="muted" x="328" y="380">pandas, bizhours.py</text>

  <rect class="box" x="532" y="424" width="196" height="112" rx="8"/>
  <text class="head" x="548" y="452">Replica data</text>
  <text class="mono" x="548" y="476">build_replica_data.py</text>
  <text class="mono" x="548" y="496">replica.json</text>
  <text class="mono" x="548" y="516">expected.json</text>

  <rect class="box" x="752" y="424" width="184" height="112" rx="8"/>
  <text class="head" x="768" y="452">HTML replica</text>
  <text class="muted" x="768" y="476">web/, model.js,</text>
  <text class="muted" x="768" y="496">ECharts, GitHub Pages</text>

  <rect class="meet" x="532" y="264" width="404" height="120" rx="8"/>
  <text class="head" x="548" y="292">Reconciliation R1 to R31</text>
  <text class="muted" x="548" y="316">Python column: tests/test_measures.py</text>
  <text class="muted" x="548" y="340">Desktop column: hidden page Reconciliation</text>
  <text class="mono" x="548" y="366">docs/reconciliation.md</text>

  <path class="flow" d="M264 154 H306"/>
  <path class="flow" d="M508 154 H526"/>
  <path class="flow" d="M728 154 H746"/>
  <path class="flow" d="M144 204 V354 H306"/>
  <path class="flow" d="M508 354 H526"/>
  <path class="flow" d="M410 404 V480 H526"/>
  <path class="flow" d="M728 480 H746"/>
  <path class="flow" d="M630 204 V258"/>
</svg>
